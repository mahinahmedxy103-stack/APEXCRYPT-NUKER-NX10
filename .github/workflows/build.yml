name: Build APEXCRYPT NX10

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW
        run: |
          choco install mingw -y
          refreshenv

      - name: Build
        shell: bash
        run: |
          ls -la
          g++ -O2 -std=c++17 main.cpp -o APEXCRYPT_NUKER_NX10.exe -lwinhttp -static || x86_64-w64-mingw32-g++ -O2 -std=c++17 main.cpp -o APEXCRYPT_NUKER_NX10.exe -lwinhttp -static
          ls -la

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: APEXCRYPT-NUKER-NX10
          path: APEXCRYPT_NUKER_NX10.exe
