name: Build APEXCRYPT NX13

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          choco install mingw curl -y --no-progress
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/nlohmann/json/v3.11.3/single_include/nlohmann/json.hpp" -OutFile "json.hpp"

      - name: Build
        shell: pwsh
        run: |
          $env:Path = "C:\ProgramData\mingw64\mingw64\bin;C:\ProgramData\chocolatey\bin;" + $env:Path
          g++ --version
          g++ -O2 -std=c++17 -I. main.cpp -o APEXCRYPT_NUKER_NX13.exe -lcurl -lws2_32 -lwldap32 -lcrypt32 -lnormaliz
          if (Test-Path APEXCRYPT_NUKER_NX13.exe) { Get-Item APEXCRYPT_NUKER_NX13.exe } else { Write-Error "Build failed"; exit 1 }

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: APEXCRYPT-NUKER-NX13
          path: APEXCRYPT_NUKER_NX13.exe
          if-no-files-found: error
