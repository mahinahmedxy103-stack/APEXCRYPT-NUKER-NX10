name: Build APEXCRYPT NUKER NX10

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install colorama aiohttp pyinstaller
          pip install git+https://github.com/dolfies/discord.py-self.git

      - name: Build EXE
        run: |
          pyinstaller --onefile --console --name "APEXCRYPT_NUKER_NX10" APEXCRYPT_NUKER_NX10.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: APEXCRYPT-NUKER-NX10
          path: dist/APEXCRYPT_NUKER_NX10.exe
