name: Build APEXCRYPT NX10

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Build EXE
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /EHsc /O2 /Fe:APEXCRYPT_NUKER_NX10.exe main.cpp winhttp.lib

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: APEXCRYPT-NUKER-NX10
          path: APEXCRYPT_NUKER_NX10.exe
